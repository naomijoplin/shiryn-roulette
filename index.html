<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>シーリン運試しルーレット</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      text-align: center;
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background: #fff8f0;
      overflow-x: hidden;
      margin: 0;
      padding: 10px;
    }
    h1 { font-size: 1.5em; margin: 10px 0; }
    p { font-size: 0.9em; }

    #wheel {
      width: 90vw; max-width: 320px;
      height: 90vw; max-height: 320px;
      margin: 20px auto;
      border-radius: 50%;
      border: 6px solid #333;
      background: conic-gradient(
        #f66 0deg 60deg,
        #6c6 60deg 120deg,
        #66f 120deg 180deg,
        #fc6 180deg 240deg,
        #6cf 240deg 300deg,
        #c6f 300deg 360deg
      );
      position: relative;
      transition: transform 3s ease-out;
    }
    .label {
      position: absolute;
      width: 40%;
      top: 50%;
      left: 50%;
      transform-origin: 0% 0%;
      text-align: center;
      font-size: clamp(8px, 1.8vw, 12px); /* ← スマホでも小さめに */
      font-weight: bold;
      color: #fff;
      line-height: 1.1; /* ← 行間を詰める */
      word-break: break-word;
    }
    #pointer {
      width: 0; height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-bottom: 25px solid #333;
      margin: 0 auto;
    }
    #result { font-size: 1.2em; margin-top: 15px; }
    button {
      padding: 10px 20px;
      font-size: 1em;
      margin-top: 10px;
    }

    .flash { animation: flash 0.5s alternate 6; }
    @keyframes flash {
      from { background: #fff8f0; }
      to { background: #ffff99; }
    }

    .confetti {
      position: fixed;
      width: 8px; height: 8px;
      border-radius: 50%;
      top: -10px;
      animation: fall 3s linear forwards;
    }
    @keyframes fall {
      to {
        transform: translateY(100vh) rotate(720deg);
        opacity: 0;
      }
    }

    /* 📱 スマホ専用の微調整 */
    @media (max-width: 480px) {
      .label {
        font-size: clamp(7px, 2.5vw, 11px);
        width: 45%;          /* 少し広めにして収めやすく */
        line-height: 1.0;    /* 行間をさらに詰める */
      }
    }
  </style>
</head>
<body>
  <h1>🎉 シーリン2周年 運試しルーレット 🎉</h1>
  <p>このルーレットは <strong>2025年11月15日まで</strong> ご利用いただけます。<br>
  今はテスト用に何度でも回せます！</p>

  <div id="pointer"></div>
  <div id="wheel"></div>
  <button onclick="spin()">ルーレットを回す</button>
  <div id="result"></div>

  <!-- 効果音 -->
  <audio id="cheers" src="https://www.soundjay.com/human/sounds/applause-8.mp3"></audio>
  <audio id="chime" src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3"></audio>
  <audio id="bell" src="https://www.soundjay.com/button/sounds/button-4.mp3"></audio>
  <audio id="fanfare" src="https://www.soundjay.com/human/sounds/cheering-4.mp3"></audio>
  <audio id="pop" src="https://www.soundjay.com/button/sounds/button-16.mp3"></audio>
  <audio id="loseSound" src="https://www.soundjay.com/button/sounds/button-10.mp3"></audio>

  <script>
    // 景品リスト
    const outcomes = [
      'ハイボール or レモンサワー無料',
      'オリジナルノンアルカクテル',
      'プチデザートサービス',
      '店長おすすめ一品',
      'プチおかしプレゼント',
      '次回使える割引券'
    ];

    const wheel = document.getElementById('wheel');

    // ラベルを扇型の中央に配置（水平補正付き）
    const sliceAngle = 360 / outcomes.length;
    outcomes.forEach((text, i) => {
      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = text;

      // 扇型の中央角度を計算
      const angle = i * sliceAngle + sliceAngle / 2;

      // 扇型の中央に配置し、文字を水平に補正
      label.style.transform =
        `rotate(${angle}deg) translate(50%) rotate(${-angle + 90}deg)`;

      wheel.appendChild(label);
    });

    function spin() {
      const result = document.getElementById('result');
      const now = Date.now();

      // 期限チェック
      const deadline = new Date('2025-11-15T23:59:59').getTime();
      if (now > deadline) {
        alert('このルーレットの開催期間は終了しました。ご参加ありがとうございました！');
        return;
      }

      // ★ テスト用に1日1回制限はコメントアウト済み ★
      // const lastSpin = localStorage.getItem('lastSpin');
      // if (lastSpin && now - lastSpin < 24 * 60 * 60 * 1000) {
      //   alert('ルーレットは24時間に1回しか回せません。また明日お試しください！');
      //   return;
      // }
      // localStorage.setItem('lastSpin', now);

      // 回転処理
      const angle = Math.floor(Math.random() * 360) + 720;
      wheel.style.transform = `rotate(${angle}deg)`;

      setTimeout(() => {
        const finalAngle = angle % 360;
        const index = Math.floor(finalAngle / (360 / outcomes.length));
        const outcome = outcomes[(outcomes.length - 1 - index) % outcomes.length];
        result.textContent = `結果：${outcome}`;

        if (outcome.includes('はずれ')) {
          document.getElementById('loseSound').play();
        } else {
          launchConfetti();
          document.body.classList.add('flash');
          setTimeout(() => document.body.classList.remove('flash'), 3000);

          if (outcome.includes('ハイボール') || outcome.includes('レモンサワー')) {
            document.getElementById('cheers').play();
          } else if (outcome.includes('ノンアルカクテル')) {
            document.getElementById('chime').play();
          } else if (outcome.includes('デザート')) {
            document.getElementById('bell').play();
          } else if (outcome.includes('おすすめ')) {
            document.getElementById('fanfare').play();
          } else if (outcome.includes('おかし')) {
            document.getElementById('pop').play();
          }
        }
      }, 3000);
    }

    // 紙吹雪を生成
    function launchConfetti() {
      for (let i = 0; i < 60; i++) {
        const confetti = document.createElement('div');
        confetti.className = 'confetti';
        confetti.style.left = Math.random() * window.innerWidth + 'px';
        confetti.style.background = `hsl(${Math.random() * 360}, 100%, 50%)`;
        confetti.style.animationDuration = (2 + Math.random() * 3) + 's';
        document.body.appendChild(confetti);
        setTimeout(() => confetti.remove(), 5000);
      }
    }
  </script>
</body>
</html>
