<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>肉とアジアンの酒場シーリン2周年記念</title>
  <style>
    body { text-align: center; font-family: sans-serif; background: #fff8f0; }
    #wheel { width: 300px; height: 300px; margin: 30px auto; border-radius: 50%; border: 8px solid #333; position: relative; }
    .segment {
      width: 50%;
      height: 50%;
      position: absolute;
      top: 0;
      left: 50%;
      transform-origin: 0% 100%;
      background: #f66;
      color: #fff;
      font-size: 20px;
      line-height: 150px;
      text-align: center;
    }
    .segment:nth-child(2) { transform: rotate(180deg); background: #6c6; }
    #pointer {
      width: 0; height: 0;
      border-left: 20px solid transparent;
      border-right: 20px solid transparent;
      border-bottom: 30px solid #333;
      margin: 0 auto;
    }
    #result { font-size: 24px; margin-top: 20px; }
    button { padding: 10px 20px; font-size: 18px; }
    @media screen and (max-width: 600px) {
  body {
    font-size: 16px;
    padding: 10px;
  }

  #wheel {
    width: 200px;
    height: 200px;
  }

  .segment {
    font-size: 16px;
    line-height: 100px;
  }

  button {
    font-size: 16px;
    padding: 8px 16px;
  }

  #result {
    font-size: 20px;
  }
}




  </style>
</head>
<body>
  <h1>🎉肉とアジアンの酒場シーリン2周年記念🎉</h1>
  <p>おかげさまで2周年！<br>
  日頃の感謝を込めて、運試しルーレットをご用意しました🎡<br>
  当たりが出たら、ちょっと嬉しい特典があるかも…？<br>
  ぜひチャレンジしてみてください！
</p>
  <p style="margin-top: 20px; font-weight: bold;">
このルーレットは【2025年11月15日まで】ご利用いただけます。<br>
1日1回の運試し、ぜひ期間中にチャレンジしてください！
</p>

  <div id="pointer"></div>
  <div id="wheel">
    <div class="segment" style="transform: rotate(0deg);">当たり</div>
    <div class="segment" style="transform: rotate(180deg);">はずれ</div>
  </div>
  <button onclick="spin()">ルーレットを回す</button>
  <div id="result"></div>
<script>
  .segment {
  width: 50%;
  height: 100%;
  position: absolute;
  top: 0;
  left: 50%;
  transform-origin: left center;
  background: #f66;
  color: #fff;
  font-size: 20px;
  line-height: 300px;
  text-align: center;
  border-top-right-radius: 100% 100%;
}
.segment:nth-child(2) {
  transform: rotate(180deg);
  background: #6c6;
}

function spin() {
  // 期限チェック
  const deadline = new Date('2025-11-15T23:59:59');
  const now = new Date();
  if (now > deadline) {
    alert('このルーレットの開催期間は終了しました。ご参加ありがとうございました！');
    return;
  }

  // ルーレット処理
  const wheel = document.getElementById('wheel');
  const result = document.getElementById('result');
  const angle = Math.floor(Math.random() * 360) + 720;
  wheel.style.transition = 'transform 3s ease-out';
  wheel.style.transform = `rotate(${angle}deg)`;
  setTimeout(() => {
    const finalAngle = angle % 360;
    const outcome = finalAngle < 180 ? '当たり🎯' : 'はずれ💦';
    result.textContent = `結果：${outcome}`;
  }, 3000);
}
</script>


</body>
</html>
