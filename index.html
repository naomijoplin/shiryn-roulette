<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>シーリン運試しルーレット</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      text-align: center;
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background: #fff8f0;
      margin: 0;
      padding: 10px;
    }
    #wheel {
      width: 90vw; max-width: 320px;
      height: 90vw; max-height: 320px;
      margin: 20px auto;
      border-radius: 50%;
      border: 6px solid #333;
      background: conic-gradient(
        #f66 0deg 72deg,
        #6c6 72deg 144deg,
        #66f 144deg 216deg,
        #fc6 216deg 288deg,
        #c6f 288deg 360deg
      );
      position: relative;
      transition: transform 3s ease-out;
    }
    .label {
      position: absolute;
      width: 35%;
      top: 50%;
      left: 50%;
      transform-origin: 0% 0%;
      text-align: center;
      font-size: clamp(9px, 2vw, 13px);
      font-weight: bold;
      color: #fff;
      line-height: 1.1;
      word-break: break-word;
    }
    #pointer {
      width: 0; height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-bottom: 25px solid #333;
      margin: 0 auto;
    }
    #result { font-size: 1.2em; margin-top: 15px; }
    button { padding: 10px 20px; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>🎉 シーリン2周年 運試しルーレット 🎉</h1>
  <p>このルーレットは <strong>2025年11月15日まで</strong> ご利用いただけます。<br>
  今はテスト用に何度でも回せます！</p>

  <div id="pointer"></div>
  <div id="wheel"></div>
  <button onclick="spin()">ルーレットを回す</button>
  <div id="result"></div>

  <script>
    const outcomes = [
      'ハイボール or レモンサワー無料',
      'オリジナルノンアルカクテル',
      'プチデザートサービス',
      '店長おすすめ一品',
      'プチおかしプレゼント'
    ];

    const wheel = document.getElementById('wheel');
    const sliceAngle = 360 / outcomes.length;

    // ラベルを配置
    outcomes.forEach((text, i) => {
      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = text;

      const angle = i * sliceAngle + sliceAngle / 2;
      label.style.transform =
        `rotate(${angle}deg) translate(55%) rotate(-${angle}deg)`;

      wheel.appendChild(label);
    });

    function spin() {
      const angle = Math.floor(Math.random() * 360) + 720;
      wheel.style.transform = `rotate(${angle}deg)`;
      setTimeout(() => {
        const finalAngle = angle % 360;
        const index = Math.floor(finalAngle / sliceAngle);
        const outcome = outcomes[(outcomes.length - 1 - index) % outcomes.length];
        document.getElementById('result').textContent = `結果：${outcome}`;
      }, 3000);
    }
  </script>
</body>
</html>
