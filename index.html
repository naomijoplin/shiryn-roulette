<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>シーリン運試しルーレット</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      text-align: center;
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background: #fff8f0;
      margin: 0;
      padding: 10px;
    }
    #wheel {
      width: 90vw; max-width: 320px;
      height: 90vw; max-height: 320px;
      margin: 20px auto;
      border-radius: 50%;
      border: 6px solid #333;
      position: relative;
      transition: transform 3s ease-out;
    }
    svg {
      width: 100%;
      height: 100%;
      border-radius: 50%;
    }
    text {
      font-size: clamp(8px, 1.4vw, 12px);
      font-weight: bold;
      fill: #fff;
      text-anchor: middle;
    }
    #pointer {
      width: 0; height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-bottom: 25px solid #333;
      margin: 0 auto;
    }
    #result { font-size: 1.2em; margin-top: 15px; }
    button { padding: 10px 20px; margin-top: 10px; }
  </style>
</head>
