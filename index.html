<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>シーリン運試しルーレット</title>
  <style>
    body {
      text-align: center;
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background: #fff8f0;
      overflow: hidden;
    }
   #wheel {
  width: 300px; height: 300px;
  margin: 30px auto;
  border-radius: 50%;
  border: 8px solid #333;
  position: relative;
  transform: rotate(0deg);   /* ← この行を削除 */
  transition: transform 3s ease-out;
}

    .label {
      position: absolute;
      width: 50%;
      height: 50%;
      top: 50%;
      left: 50%;
      transform-origin: 0% 0%;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
      color: #fff;
    }
    #pointer {
      width: 0; height: 0;
      border-left: 20px solid transparent;
      border-right: 20px solid transparent;
      border-bottom: 30px solid #333;
      margin: 0 auto;
    }
    #result { font-size: 24px; margin-top: 20px; }
    button { padding: 10px 20px; font-size: 18px; }

    /* 当たり演出用の点滅 */
    .flash { animation: flash 0.5s alternate 6; }
    @keyframes flash {
      from { background: #fff8f0; }
      to { background: #ffff99; }
    }

    /* 紙吹雪 */
    .confetti {
      position: fixed;
      width: 10px; height: 10px;
      border-radius: 50%;
      top: -10px;
      animation: fall 3s linear forwards;
    }
    @keyframes fall {
      to {
        transform: translateY(100vh) rotate(720deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <h1>🎉 シーリン2周年 運試しルーレット 🎉</h1>
  <p>このルーレットは <strong>2025年11月15日まで</strong> ご利用いただけます。<br>
  1日1回の運試し、ぜひ挑戦してください！</p>

  <div id="pointer"></div>
  <div id="wheel"></div>
  <button onclick="spin()">ルーレットを回す</button>
  <div id="result"></div>

  <!-- 効果音 -->
  <audio id="cheers" src="https://www.soundjay.com/human/sounds/applause-8.mp3"></audio>
  <audio id="chime" src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3"></audio>
  <audio id="bell" src="https://www.soundjay.com/button/sounds/button-4.mp3"></audio>
  <audio id="fanfare" src="https://www.soundjay.com/human/sounds/cheering-4.mp3"></audio>
  <audio id="pop" src="https://www.soundjay.com/button/sounds/button-16.mp3"></audio>
  <audio id="loseSound" src="https://www.soundjay.com/button/sounds/button-10.mp3"></audio>

  <script>
    // 景品リスト
    const outcomes = [
      'ハイボール or レモンサワー無料',
      'オリジナルノンアルカクテル',
      'プチデザートサービス',
      '店長おすすめ一品',
      'プチおかしプレゼント',
      'はずれ💦'
    ];

    const wheel = document.getElementById('wheel');

    // ラベルを配置
    outcomes.forEach((text, i) => {
      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = text;
      label.style.transform = `rotate(${i * (360 / outcomes.length)}deg) translate(60px) rotate(${90}deg)`;
      wheel.appendChild(label);
    });

    function spin() {
      const result = document.getElementById('result');
      const now = Date.now();

      // 期限チェック
      const deadline = new Date('2025-11-15T23:59:59').getTime();
      if (now > deadline) {
        alert('このルーレットの開催期間は終了しました。ご参加ありがとうございました！');
        return;
      }

      // 1日1回制限
      const lastSpin = localStorage.getItem('lastSpin');
      if (lastSpin && now - lastSpin < 24 * 60 * 60 * 1000) {
        alert('ルーレットは24時間に1回しか回せません。また明日お試しください！');
        return;
      }
      localStorage.setItem('lastSpin', now);

      // 回転処理
      const angle = Math.floor(Math.random() * 360) + 720;
      wheel.style.transform = `rotate(${angle}deg)`;

      setTimeout(() => {
        const finalAngle = angle % 360;
        const index = Math.floor(finalAngle / (360 / outcomes.length));
        const outcome = outcomes[(outcomes.length - 1 - index) % outcomes.length];
        result.textContent = `結果：${outcome}`;

        // 当たり演出
        if (outcome.includes('はずれ')) {
          document.getElementById('loseSound').play();
        } else {
          launchConfetti();
          document.body.classList.add('flash');
          setTimeout(() => document.body.classList.remove('flash'), 3000);

          if (outcome.includes('ハイボール') || outcome.includes('レモンサワー')) {
            document.getElementById('cheers').play();
          } else if (outcome.includes('ノンアルカクテル')) {
            document.getElementById('chime').play();
          } else if (outcome.includes('デザート')) {
            document.getElementById('bell').play();
          } else if (outcome.includes('おすすめ')) {
            document.getElementById('fanfare').play();
          } else if (outcome.includes('おかし')) {
            document.getElementById('pop').play();
          }
        }
      }, 3000);
    }

    // 紙吹雪を生成
    function launchConfetti() {
      for (let i = 0; i < 60; i++) {
        const confetti = document.createElement('div');
        confetti.className = 'confetti';
        confetti.style.left = Math.random() * window.innerWidth + 'px';
        confetti.style.background = `hsl(${Math.random() * 360}, 100%, 50%)`;
        confetti.style.animationDuration = (2 + Math.random() * 3) + 's';
        document.body.appendChild(confetti);
        setTimeout(() => confetti.remove(), 5000);
      }
    }
  </script>
</body>
</html>
