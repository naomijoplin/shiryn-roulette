<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>肉とアジアンの酒場シーリン2周年記念ルーレット</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      text-align: center;
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background: #fff8f0;
      margin: 0;
      padding: 10px;
    }
    h1 {
      font-size: clamp(16px, 5vw, 24px);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #wheel {
      width: 90vw;
      max-width: 320px;
      height: 90vw;
      max-height: 320px;
      margin: 20px auto;
      border-radius: 50%;
      position: relative;
      transition: transform 3s ease-out;
    }
    svg {
      width: 100%;
      height: 100%;
      border-radius: 50%;
    }
    text {
      font-size: clamp(8px, 1.4vw, 12px);
      font-weight: bold;
      fill: #fff;
      text-anchor: middle;
    }
    #result {
      font-size: 1.4em;
      font-weight: bold;
      color: #d33;
      background: #fff0f0;
      border: none;
      padding: 10px;
      margin-top: 30px;
      display: inline-block;
      animation: pop 0.6s ease;
      border-radius: 10px;
    }
    @keyframes pop {
      0% { transform: scale(0.8); opacity: 0; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); }
    }
    @keyframes flash {
      0% {
        filter: drop-shadow(-2px 0 4px #ffcc00)
                drop-shadow(2px 0 4px #ffcc00)
                drop-shadow(0 0 6px #ffd700);
      }
      50% {
        filter: drop-shadow(-4px 0 10px #ffff66)
                drop-shadow(4px 0 10px #ffff66)
                drop-shadow(0 0 14px #ffd700);
      }
      100% {
        filter: drop-shadow(-2px 0 4px #ffcc00)
                drop-shadow(2px 0 4px #ffcc00)
                drop-shadow(0 0 6px #ffd700);
      }
    }
    button {
      padding: 10px 20px;
      margin-top: 10px;
      border-radius: 12px;
      border: none;
      background: #3399ff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>🎉シーリン2周年記念🎉</h1>
  <p>このルーレットは <strong>2025年11月15日まで</strong> ご利用いただけます。<br>
  今はテスト用に何度でも回せます！</p>

  <div id="wheel">
    <svg viewBox="0 0 200 200">
      <defs id="paths"></defs>
      <g id="slices"></g>
      <g id="labels"></g>
    </svg>
  </div>

  <button onclick="spin()">ルーレットを回す</button>
  <div id="result"></div>

 <script>
  function spin() {
    const wheel = document.getElementById('wheel');
    const angle = Math.floor(Math.random() * 360) + 720;
    wheel.style.transform = `rotate(${angle}deg)`;

    setTimeout(() => {
      const finalAngle = angle % 360;
      const index = Math.floor(finalAngle / (360 / outcomes.length));
      const hitIndex = index % outcomes.length;
      const outcome = outcomes[hitIndex];

      document.querySelectorAll('path').forEach(p => {
        p.style.opacity = '1';
        p.style.stroke = 'none';
        p.style.filter = 'none';
        p.style.animation = 'none';
      });

      const hitSlice = document.querySelector(`.slice${hitIndex}`);
      hitSlice.style.fill = '#ffd700'; // 金色
      hitSlice.style.stroke = '#b8860b'; // 濃い金枠
      hitSlice.style.strokeWidth = '3';
      hitSlice.style.filter = `
        drop-shadow(-4px 0 6px #ffcc00)
        drop-shadow(4px 0 6px #ffcc00)
        drop-shadow(0 0 12px #ffd700)
      `;
      hitSlice.style.animation = 'flash 1s ease infinite';

      const resultEl = document.getElementById('result');
      resultEl.innerHTML = `🎯 結果：<br>${outcome.join(' ')}`;
      resultEl.style.animation = 'pop 0.6s ease';
    }, 3000);
  }
</script>
