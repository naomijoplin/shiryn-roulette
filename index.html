<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>肉とアジアンの酒場シーリン2周年記念ルーレット</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      text-align: center;
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background: #fff8f0;
      margin: 0;
      padding: 10px;
    }
    h1 {
      font-size: clamp(16px, 5vw, 24px);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #wheel {
      width: 90vw;
      max-width: 320px;
      height: 90vw;
      max-height: 320px;
      margin: 20px auto;
      border-radius: 50%;
      position: relative;
      transition: transform 3s ease-out;
    }
    svg {
      width: 100%;
      height: 100%;
      border-radius: 50%;
    }
    text {
      font-size: clamp(8px, 1.4vw, 12px);
      font-weight: bold;
      fill: #fff;
      text-anchor: middle;
    }
    #result {
      font-size: 1.4em;
      font-weight: bold;
      color: #d33;
      background: #fff0f0;
      border: none;
      padding: 10px;
      margin-top: 30px;
      display: inline-block;
      animation: pop 0.6s ease;
      border-radius: 10px;
    }
    @keyframes pop {
      0% { transform: scale(0.8); opacity: 0; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); }
    }
    @keyframes flash {
      0% {
        filter: drop-shadow(-2px 0 4px #ffcc00)
                drop-shadow(2px 0 4px #ffcc00)
                drop-shadow(0 0 6px #ffd700);
      }
      50% {
        filter: drop-shadow(-4px 0 10px #ffff66)
                drop-shadow(4px 0 10px #ffff66)
                drop-shadow(0 0 14px #ffd700);
      }
      100% {
        filter: drop-shadow(-2px 0 4px #ffcc00)
                drop-shadow(2px 0 4px #ffcc00)
                drop-shadow(0 0 6px #ffd700);
      }
      .flash {
  animation: flash 1s ease infinite;
}

    }
    button {
      padding: 10px 20px;
      margin-top: 10px;
      border-radius: 12px;
      border: none;
      background: #3399ff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>🎉シーリン2周年記念🎉</h1>
  <p>このルーレットは <strong>2025年11月15日まで</strong> ご利用いただけます。<br>
  今はテスト用に何度でも回せます！</p>

  <div id="wheel">
    <svg viewBox="0 0 200 200">
      <defs id="paths"></defs>
      <g id="slices"></g>
      <g id="labels"></g>
    </svg>
  </div>

  <button onclick="spin()">ルーレットを回す</button>
  <div id="result"></div>

  <script>
    const outcomes = [
      ['ハイボール', 'or', 'レモンサワー', '無料'],
      ['オリジナル', 'ノンアルカクテル','無料'],
      ['プチ', 'デザートサービス'],
      ['店長おすすめ', '一品','サービス'],
      ['プチおかし', 'プレゼント']
    ];

    const sliceAngle = 360 / outcomes.length;
    const radius = 100;
    const paths = document.getElementById('paths');
    const labels = document.getElementById('labels');
    const slices = document.getElementById('slices');

    outcomes.forEach((lines, i) => {
      const startAngle = i * sliceAngle;
      const endAngle = startAngle + sliceAngle;
      const largeArc = sliceAngle > 180 ? 1 : 0;

      const x1 = radius + radius * Math.cos(Math.PI * startAngle / 180);
      const y1 = radius + radius * Math.sin(Math.PI * startAngle / 180);
      const x2 = radius + radius * Math.cos(Math.PI * endAngle / 180);
      const y2 = radius + radius * Math.sin(Math.PI * endAngle / 180);

      const pathData = `
        M ${radius},${radius}
        L ${x1},${y1}
        A ${radius},${radius} 0 ${largeArc} 1 ${x2},${y2}
        Z
      `;

      const colors = ['#f66','#6c6','#66f','#fc6','#c6f','#6cf'];
      const slice = document.createElementNS("http://www.w3.org/2000/svg", "path");
      slice.setAttribute("d", pathData);
      slice.setAttribute("fill", colors[i % colors.length]);
      slice.setAttribute("class", `slice${i}`);
      slices.appendChild(slice);

      const arcPath = document.createElementNS("http://www.w3.org/2000/svg", "path");
      const arcId = `arc${i}`;
      const arcX1 = radius + (radius * 0.7) * Math.cos(Math.PI * startAngle / 180);
      const arcY1 = radius + (radius * 0.7) * Math.sin(Math.PI * startAngle / 180);
      const arcX2 = radius + (radius * 0.7) * Math.cos(Math.PI * endAngle / 180);
      const arcY2 = radius + (radius * 0.7) * Math.sin(Math.PI * endAngle / 180);

      arcPath.setAttribute("d", `M ${arcX1},${arcY1} A ${radius*0.75},${radius*0.75} 0 ${largeArc} 1 ${arcX2},${arcY2}`);
      arcPath.setAttribute("id", arcId);
      paths.appendChild(arcPath);

      lines.forEach((lineText, lineIndex) => {
        const textEl = document.createElementNS("http://www.w3.org/2000/svg", "text");
        const dy = -14 + lineIndex * 13;
        textEl.setAttribute("dy", dy.toString());

        const textPath = document.createElementNS("http://www.w3.org/2000/svg", "textPath");
        textPath.setAttribute("href", `#${arcId}`);
        textPath.setAttribute("startOffset", "50%");
        textPath.textContent = lineText;

        textEl.appendChild(textPath);
        labels.appendChild(textEl);
      });
    });

    function spin() {
      const lastSpin = localStorage.getItem('lastSpinDate');
      const today = new Date().toISOString().slice(0, 10);

      if (lastSpin === today) {
        alert('今日はもう回しました！また明日お楽しみに✨');
        return;
      }

      const wheel = document.getElementById('wheel');
      const angle = Math.floor(Math.random() * 360) + 720;
      wheel.style.transform = `rotate(${angle}deg)`;

      setTimeout(() => {
        const finalAngle = angle % 360;
        const index = Math.floor(finalAngle / sliceAngle);
        const hitIndex = index % outcomes.length;
        const outcome = outcomes[hitIndex];

        document.querySelectorAll('path').forEach(p => {
          p.style.opacity = '1';
          p.style.stroke = 'none';
          p.style.filter = 'none';
          p.style.animation = 'none';
        });

        const hitSlice = document.querySelector(`.slice${hitIndex}`);
        hitSlice.style.fill = '#ffd700';
        hitSlice.style.stroke = '#b8860b';
        hitSlice.style.strokeWidth = '3';
        hitSlice.style.filter = `
         drop-shadow(-4px 0 6px #ffcc00)
          drop-shadow(4px 0 6px #ffcc00)
          drop-shadow(0 0 12px #ffd700)
        `;
      hitSlice.classList.add('flash');


        const resultEl = document.getElementById('result');
        resultEl.innerHTML = `🎯 結果：<br>${outcome.join(' ')}`;
        resultEl.style.animation = 'pop 0.6s ease';

        localStorage.setItem('lastSpinDate', today);
      }, 3000);
    }
  </script>
</body>
</html>
